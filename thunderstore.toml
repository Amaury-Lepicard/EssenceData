[config]
schemaVersion = "0.0.1"

[package]
namespace = "Conductor"
name = "EssenceData"
versionNumber = "0.3.0"
description = "Data mod containing Essences for Units. This mod by itself does not surface the mechanic in-game."
websiteUrl = "https://github.com/Monster-Train-2-Modding-Group/EssenceData"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.7.28"
Conductor-Conductor = "0.5.14"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./"

[[build.copy]]
source = "./plugin_build"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]

[publish.categories]
monster-train-2 = ["libraries"]
